<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickCab Driver Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f8fbff 0%, #eef4ff 100%);
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }

    .dashboard-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
    }

    .table thead {
      background: #0d6efd;
      color: white;
    }

    .badge-pill {
      padding: 0.5rem 0.8rem;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="card dashboard-card">
      <div class="card-body border-bottom">
        <button id="enableSoundBtn" class="btn btn-outline-primary btn-sm">Enable sound</button>
        <span class="text-muted small ms-2">Click once to allow booking alerts.</span>
      </div>
      <div class="card-body p-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
          <div>
            <h2 class="mb-1">🚖 Driver Dashboard</h2>
            <p class="text-muted mb-0">Manage ride requests and respond quickly.</p>
          </div>
          <span id="statusBadge" class="badge bg-success badge-pill">Online</span>
        </div>

        <div id="alertBox" class="alert alert-warning d-none" role="alert">
          🔔 New booking received!
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Pickup</th>
                <th>Drop</th>
                <th>Vehicle</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="bookingTable">
              <tr>
                <td colspan="5" class="text-center text-muted py-4">Loading bookings...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <audio id="bookingAlarm" preload="auto">
    <source src="sounds/alarm.mp3" type="audio/mpeg">
  </audio>

  <script src="driver.js"></script>
</body>
</html>
